# Dependabot: version updates and security updates.
# Reference: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Security updates (fixes for a published advisory) are raised by Dependabot itself and are not held back
# by the schedule or by the pull request limit. Turn on "Dependabot alerts" and "Dependabot security
# updates" under Settings > Code security; this file shapes the routine version updates and their grouping.

version: 2
updates:
  # Python packages (poetry.lock). Checked daily so the fix for a new advisory is proposed quickly.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Actions used by the workflows (pinned versions go stale, and actions run with repository access).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
